{% extends "base.html" %}
{% block title %}New quiz{% endblock %}
{% block content %}
<p class="crumb"><a href="{{ url_for('instructor_offering', oid=offering.offering_id) }}">{{ course.course_code }}</a> / new quiz</p>
<h1>New quiz</h1>
<form method="post" class="form" id="quiz-build">{{ csrf_field() }}
  <div class="card">
    <div class="row"><label>Title <input name="title" required></label>
      <label>Time limit (min) <input type="number" name="time_limit" value="20" min="1" required></label>
      <label>Attempts <input type="number" name="max_attempts" value="1" min="1" max="10" required></label></div>
    <div class="row"><label>Opens <input type="datetime-local" name="available_from" required></label>
      <label>Closes <input type="datetime-local" name="available_until" required></label></div>
  </div>
  <div id="questions"></div>
  <div class="actions"><button type="button" class="btn" id="add-q">+ Add question</button><button class="btn primary">Create quiz</button></div>
  <p class="hint">Tick the radio button next to the correct option. Every question needs at least two options.</p>
</form>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='quiz_build.js') }}"></script>{% endblock %}
